[project]
name = "tripura-cpi-backend"
version = "0.1.0"
description = "FastAPI backend for Tripura CPI survey system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "pwdlib[argon2]>=0.2.0",
    "python-jose>=3.3.0",
    "openpyxl>=3.1.0",
    "python-multipart>=0.0.22",
    "slowapi>=0.1.9",
    "jinja2>=3.1.0",
    "weasyprint>=62.0",
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pre-commit>=4.0.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["build", "dist", ".venv", "logs"]
show-fixes = true

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "T20", "N"]
ignore = ["E501", "B008", "B904", "SIM108", "SIM105"]
per-file-ignores = { "__init__.py" = ["F401"] }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
