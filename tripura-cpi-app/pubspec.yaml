name: surveyor_app
description: Surveyor App - Govt of Tripura CPI Price Collection System
publish_to: 'none'
version: 0.1.1+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^8.0.2
  fl_chart: ^1.2.0
  intl: ^0.20.2
  shared_preferences: ^2.2.2
  pinput: ^6.0.2
  http: ^1.2.1
  flutter_dotenv: ^5.2.1
  sqflite: ^2.3.0
  path: ^1.8.3
  uuid: ^4.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/app-ico.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/data/mock_data.json
    - .env
