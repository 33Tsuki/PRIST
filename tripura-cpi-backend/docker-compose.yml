services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: tripura-cpi-backend
    volumes:
      - ./app:/app/app
      - ${LOGS_HOST_DIR:-./logs}:/app/logs
      - ${REPORTS_HOST_DIR:-./generated_reports}:/app/generated_reports
    env_file:
      - .env
    environment:
      - REPORTS_DIR=/app/generated_reports
      - LOG_DIR=/app/logs
    ports:
      - "8000:8000"
    networks:
      - tripura-cpi-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: tripura-cpi-postgres
    profiles:
      - local-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tripura_cpi}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tripura-cpi-network
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: tripura-cpi-pgadmin
    profiles:
      - local-db
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@tripura-cpi.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    networks:
      - tripura-cpi-network
    restart: unless-stopped
    depends_on:
      - postgres

volumes:
  postgres_data:
  pgadmin_data:

networks:
  tripura-cpi-network:
    driver: bridge
